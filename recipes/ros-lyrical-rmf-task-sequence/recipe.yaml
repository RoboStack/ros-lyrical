# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rmf-task-sequence
  version: 2.9.0
source:
  git: https://github.com/ros2-gbp/rmf_task-release.git
  tag: release/lyrical/rmf_task_sequence/2.9.0-3
  target_directory: ros-lyrical-rmf-task-sequence/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Implementation of phase-sequence tasks for the Robotics Middleware Framework
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-catch2
    - ros-lyrical-ament-cmake-uncrustify
    - ros-lyrical-nlohmann-json-schema-validator-vendor
    - ros-lyrical-rmf-api-msgs
    - ros-lyrical-rmf-task
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
  run:
    - nlohmann_json
    - python
    - ros-lyrical-nlohmann-json-schema-validator-vendor
    - ros-lyrical-rmf-api-msgs
    - ros-lyrical-rmf-task
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
