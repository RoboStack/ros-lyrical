# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rmf-visualization-navgraphs
  version: 2.5.1
source:
  git: https://github.com/ros2-gbp/rmf_visualization-release.git
  tag: release/lyrical/rmf_visualization_navgraphs/2.5.1-3
  target_directory: ros-lyrical-rmf-visualization-navgraphs/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: A package to visualiize the navigation graphs of fleets
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-geometry-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rmf-building-map-msgs
    - ros-lyrical-rmf-fleet-msgs
    - ros-lyrical-rmf-traffic
    - ros-lyrical-rmf-traffic-ros2
    - ros-lyrical-rmf-utils
    - ros-lyrical-rmf-visualization-msgs
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.18.* lyrical_*
  run:
    - python
    - ros-lyrical-geometry-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rmf-building-map-msgs
    - ros-lyrical-rmf-fleet-msgs
    - ros-lyrical-rmf-traffic
    - ros-lyrical-rmf-traffic-ros2
    - ros-lyrical-rmf-visualization-msgs
    - ros-lyrical-ros-workspace
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.18.* lyrical_*
