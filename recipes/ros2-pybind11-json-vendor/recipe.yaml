# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-pybind11-json-vendor
  version: 0.7.0
source:
  git: https://github.com/ros2-gbp/pybind11_json_vendor-release.git
  tag: release/lyrical/pybind11_json_vendor/0.7.0-1
  target_directory: ros2-pybind11-json-vendor/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/pybind11_json_vendor
  license: Apache-2.0
  summary: A vendor package for pybind11_json for Modern C++
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - pybind11
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - nlohmann_json
    - numpy
    - pip
    - pybind11_json
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-vendor-package
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-pybind11-vendor
    - ros2-ros-environment
    - ros2-ros-workspace
    - pybind11
  run:
    - nlohmann_json
    - pybind11_json
    - python
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-pybind11-vendor
    - ros2-ros-workspace
