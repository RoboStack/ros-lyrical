# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-nlohmann-json-schema-validator-vendor
  version: 0.5.0
source:
  git: https://github.com/ros2-gbp/nlohmann_json_schema_validator_vendor-release.git
  tag: release/lyrical/nlohmann_json_schema_validator_vendor/0.5.0-3
  target_directory: ros2-nlohmann-json-schema-validator-vendor/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/nlohmann_json_schema_validator_vendor
  license: Apache-2.0 OR MIT
  summary: A vendor package for JSON schema validator for JSON for Modern C++
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - nlohmann_json
    - python
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-ros-workspace
