# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-libg2o
  version: 2020.5.29
source:
  git: https://github.com/ros2-gbp/libg2o-release.git
  tag: release/lyrical/libg2o/2020.5.29-7
  target_directory: ros-lyrical-libg2o/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/RainerKuemmerle/g2o
  license: BSD-3-Clause
  summary: The libg2o library from http://openslam.org/g2o.html
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - blas-devel
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - libgl-devel
    - libopengl-devel
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
    - suitesparse
  run:
    - blas-devel
    - eigen
    - libgl-devel
    - libopengl-devel
    - python
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
    - suitesparse
