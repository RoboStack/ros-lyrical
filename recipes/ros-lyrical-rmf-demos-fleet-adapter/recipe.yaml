# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rmf-demos-fleet-adapter
  version: 2.8.2
source:
  git: https://github.com/ros2-gbp/rmf_demos-release.git
  tag: release/lyrical/rmf_demos_fleet_adapter/2.8.2-4
  target_directory: ros-lyrical-rmf-demos-fleet-adapter/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Fleet adapters for interfacing with RMF Demos robots with a fleet manager via REST API
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-copyright
    - ros-lyrical-ament-flake8
    - ros-lyrical-ament-pep257
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
    - setuptools
  run:
    - fastapi
    - numpy
    - pydantic
    - pyproj
    - python
    - pyyaml
    - requests
    - ros-lyrical-launch-xml
    - ros-lyrical-rclpy
    - ros-lyrical-rmf-fleet-adapter-python
    - ros-lyrical-rmf-fleet-msgs
    - ros-lyrical-rmf-task-msgs
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.18.* lyrical_*
    - uvicorn
