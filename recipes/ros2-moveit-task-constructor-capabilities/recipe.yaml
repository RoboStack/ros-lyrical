# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-moveit-task-constructor-capabilities
  version: 0.2.0
source:
  git: https://github.com/ros2-gbp/moveit_task_constructor-release.git
  tag: release/lyrical/moveit_task_constructor_capabilities/0.2.0-1
  target_directory: ros2-moveit-task-constructor-capabilities/src/work
  patches:
    - patch/ros-lyrical-moveit-task-constructor-capabilities.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/moveit/moveit_task_constructor
  license: BSD-3-Clause
  summary: MoveGroupCapabilites to interact with MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-controller-manager
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-launch-testing
    - ros2-launch-testing-ament-cmake
    - ros2-moveit-configs-utils
    - ros2-moveit-core
    - ros2-moveit-resources-panda-moveit-config
    - ros2-moveit-ros-move-group
    - ros2-moveit-ros-planning
    - ros2-moveit-task-constructor-core
    - ros2-moveit-task-constructor-msgs
    - ros2-pluginlib
    - ros2-rclcpp-action
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-std-msgs
  run:
    - fmt
    - python
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-moveit-core
    - ros2-moveit-ros-move-group
    - ros2-moveit-ros-planning
    - ros2-moveit-task-constructor-core
    - ros2-moveit-task-constructor-msgs
    - ros2-pluginlib
    - ros2-rclcpp-action
    - ros2-ros-workspace
    - ros2-std-msgs
