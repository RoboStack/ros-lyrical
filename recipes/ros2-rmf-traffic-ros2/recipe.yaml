# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rmf-traffic-ros2
  version: 2.13.0
source:
  git: https://github.com/ros2-gbp/rmf_ros2-release.git
  tag: release/lyrical/rmf_traffic_ros2/2.13.0-1
  target_directory: ros2-rmf-traffic-ros2/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 25
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/rmf_ros2
  license: Apache-2.0
  summary: A package containing messages used by the RMF traffic management system.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - libuuid
    - nlohmann_json
    - numpy
    - pip
    - proj
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-catch2
    - ros2-ament-cmake-uncrustify
    - ros2-backward-ros
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-rclcpp
    - ros2-rmf-building-map-msgs
    - ros2-rmf-fleet-msgs
    - ros2-rmf-reservation-msgs
    - ros2-rmf-site-map-msgs
    - ros2-rmf-traffic
    - ros2-rmf-traffic-msgs
    - ros2-rmf-utils
    - ros2-ros-environment
    - ros2-ros-workspace
    - yaml-cpp
    - zlib
  run:
    - libuuid
    - nlohmann_json
    - proj
    - python
    - ros2-backward-ros
    - ros2-distro-mutex 0.20.* lyrical_*
    - ros2-rclcpp
    - ros2-rmf-building-map-msgs
    - ros2-rmf-fleet-msgs
    - ros2-rmf-reservation-msgs
    - ros2-rmf-site-map-msgs
    - ros2-rmf-traffic
    - ros2-rmf-traffic-msgs
    - ros2-rmf-utils
    - ros2-ros-workspace
    - yaml-cpp
    - zlib
