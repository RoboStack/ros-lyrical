conda_forge_pinning_version: 2026.09.25.23.22.04
migrations:
  - elfutils0196
  - giflib6
  - go_macos
  - gstreamer128
  - hdf52
  - libboost190
  - proj99
  - urdfdom6
  - vtk970
pinning_overrides:
  # Build commands provide their channels with `-c`, so omit the inherited
  # conda-forge-pinning channel_sources value from the rendered configuration.
  channel_sources:
  channel_targets:
  # glibc floor raised from 2.17 (CentOS 7) to 2.28: conda-forge packages such as
  # gazebo/openal-soft already require it. macOS deployment target raised to 14.0.
  # c_stdlib_version shares a zip_keys group with the compiler versions, so the whole
  # group has to be overridden; the compiler entries mirror the conda-forge base file
  # and must be refreshed when `vinca-pinning-update` moves to a newer compiler.
  c_stdlib_version:
    - 2.28                       # [linux and not riscv64]
    - 2.39                       # [linux and riscv64]
    - 2.28                       # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
    - 14.0                       # [osx]
  c_compiler_version:
    - 15                         # [linux]
    - 21                         # [osx]
    - 14                         # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  cxx_compiler_version:
    - 15                         # [linux]
    - 21                         # [osx]
    - 14                         # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  fortran_compiler_version:
    - 15                         # [unix]
    - 5                          # [win64]
    - 22                         # [win and arm64]
    - 14                         # [linux and (x86_64 or aarch64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  cuda_compiler_version:
    - None
    - 12.9                       # [((linux and (x86_64 or aarch64)) or win64) and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
  libzenohc:
    - 1.10.1
  libzenohcxx:
    - 1.10.1
  # cartographer was built with lua 5.4.8, otherwise it pulls in 5.5 which leads to conflicts
  lua:
    - 5.4
  # conda-forge published sip 6.16.1 on 2026-09-08, which broke ABI targeting for
  # packages like qt_gui_cpp_sip that build against PyQt-sip's fixed ABI v12.
  # Pin back to the last known-good line until upstream fixes it.
  sip:
    - 6.15
  # conda-forge's newest pyqt6 (6.11.0) still requires qt6-main <6.12, so
  # packages built against the newly released qt6-main 6.12 can't be installed
  # together with python_qt_binding (pyqt6). Pin both to 6.11 until pyqt6 is
  # rebuilt for qt6-main 6.12.
  pyqt6:
    - 6.11
  qt6_main:
    - 6.11
  python:
    - 3.14.* *_cp314
  is_python_min:
    - false
  python_impl:
    - cpython
