jobs:
  stage_0_job_0:
    name: ros2-grid-map-cmake-helpers ros2-cloudini-lib ros2-grid-map-core ros2-grid-map-msgs
      ros2-cloudini-ros grid-map-cmake-helpers cloudini-lib ros2-grid-map-cv grid-map-msgs
      grid-map-core cloudini-ros ros2-grid-map-ros grid-map-cv ros2-grid-map-rviz-plugin
      grid-map-ros grid-map-rviz-plugin
    runs-on: macos-15
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-grid-map-cmake-helpers ros2-cloudini-lib ros2-grid-map-core
        ros2-grid-map-msgs ros2-cloudini-ros ros-lyrical-grid-map-cmake-helpers ros-lyrical-cloudini-lib
        ros2-grid-map-cv ros-lyrical-grid-map-msgs ros-lyrical-grid-map-core ros-lyrical-cloudini-ros
        ros2-grid-map-ros ros-lyrical-grid-map-cv ros2-grid-map-rviz-plugin ros-lyrical-grid-map-ros
        ros-lyrical-grid-map-rviz-plugin
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-grid-map-cmake-helpers ros2-cloudini-lib ros2-grid-map-core
          ros2-grid-map-msgs ros2-cloudini-ros ros-lyrical-grid-map-cmake-helpers
          ros-lyrical-cloudini-lib ros2-grid-map-cv ros-lyrical-grid-map-msgs ros-lyrical-grid-map-core
          ros-lyrical-cloudini-ros ros2-grid-map-ros ros-lyrical-grid-map-cv ros2-grid-map-rviz-plugin
          ros-lyrical-grid-map-ros ros-lyrical-grid-map-rviz-plugin
        BUILD_TARGET: osx-arm64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
name: build_osx_arm64
on:
  push:
    branches:
    - buildbranch_osx_arm64
