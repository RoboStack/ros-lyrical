jobs:
  stage_0_job_0:
    name: ros2-zenoh-cpp-vendor ros2-rmw-zenoh-cpp zenoh-cpp-vendor rmw-zenoh-cpp
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-zenoh-cpp-vendor ros2-rmw-zenoh-cpp ros-lyrical-zenoh-cpp-vendor
        ros-lyrical-rmw-zenoh-cpp
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-zenoh-cpp-vendor ros2-rmw-zenoh-cpp ros-lyrical-zenoh-cpp-vendor
          ros-lyrical-rmw-zenoh-cpp
        BUILD_TARGET: osx-64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      attestations: write
name: build_osx64
on:
  push:
    branches:
    - buildbranch_osx
